<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  #stage {
    height: calc(100vh - 12px);
    margin: 6px;
    -webkit-app-region: drag;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    background: rgba(12, 14, 18, 0.55);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  #list {
    position: absolute;
    top: 50%; left: 30px; right: 30px;
    transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.3, 1);
    will-change: transform;
  }
  .li {
    height: 38px; line-height: 38px;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 16px; color: rgba(255,255,255,0.55);
    text-shadow: 0 1px 5px rgba(0,0,0,0.9);
    transition: color 0.35s, font-size 0.35s, transform 0.35s;
  }
  .li.cur {
    color: #ffffff; font-size: 22px; font-weight: 700;
    -webkit-text-stroke: 0.6px rgba(0,0,0,0.35);
    text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 40px rgba(124,140,248,0.45);
  }
  .li.plain {
    color: rgba(255,255,255,0.85); font-size: 15px; font-weight: 400;
    white-space: normal; line-height: 1.8; height: auto; padding: 0 20px;
  }
  #tools {
    position: fixed; top: 6px; right: 8px; display: flex; gap: 6px;
    -webkit-app-region: no-drag; opacity: 0; transition: opacity 0.2s;
  }
  #stage:hover #tools { opacity: 1; }
  #tools button {
    background: rgba(20,23,28,0.85); border: 1px solid #2a303b; color: #8b93a1;
    border-radius: 6px; width: 22px; height: 22px; font-size: 11px;
    cursor: pointer; line-height: 1;
  }
  #tools button:hover { color: #fff; }
  #resize-hint {
    position: fixed; right: 8px; bottom: 7px;
    color: rgba(255,255,255,0.28); font-size: 14px; line-height: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="list"></div>
    <div id="tools">
      <button id="smaller" title="缩小歌词框">−</button>
      <button id="larger" title="放大歌词框">＋</button>
      <button id="reset" title="恢复默认大小">↺</button>
      <button id="pin" title="置顶/取消置顶">📌</button>
      <button id="close" title="关闭歌词">✕</button>
    </div>
    <div id="resize-hint" title="可拖动窗口边缘调整大小">◢</div>
  </div>
  <script>
    const LIST_H = 38;
    let lines = [];
    let pinned = true;
    let plainMode = false;
    const listEl = document.getElementById("list");

    const build = (arr, curIdx) => {
      listEl.innerHTML = "";
      listEl.style.top = "50%";
      for (let i = 0; i < arr.length; i++) {
        const d = document.createElement("div");
        d.className = "li";
        d.textContent = arr[i].text;
        listEl.appendChild(d);
      }
      position(curIdx);
    };

    const position = (idx) => {
      const n = listEl.children.length;
      if (n === 0) return;
      const i = Math.max(0, Math.min(idx, n - 1));
      // list 顶部锚在舞台 50%，把当前行中心移到锚点
      const y = -(i + 0.5) * LIST_H;
      listEl.style.transform = `translateY(${y}px)`;
      for (let k = 0; k < n; k++) {
        listEl.children[k].classList.toggle("cur", k === i);
      }
    };

    const render = (t) => {
      if (plainMode) return;
      let idx = -1;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].t <= t) idx = i;
        else break;
      }
      position(idx < 0 ? 0 : idx);
    };

    window.api.lyrics.onSet((d) => {
      lines = d.lines || [];
      plainMode = !!d.plain;
      const cur = d.currentTime || 0;
      if (d.status === "loading") {
        build([{ text: "正在获取歌词…" }], 0);
      } else if (d.status === "notfound") {
        build([{ text: "未找到歌词，可把 .lrc 放到歌曲同目录" }], 0);
      } else if (plainMode) {
        listEl.innerHTML = "";
        const d2 = document.createElement("div");
        d2.className = "li plain";
        d2.textContent = d.plain;
        listEl.appendChild(d2);
        listEl.style.top = "50%";
        listEl.style.transform = "translateY(-50%)";
        plainMode = true;
      } else {
        build(lines, 0);
        render(cur);
      }
    });
    window.api.lyrics.onTime((d) => {
      render(d.currentTime || 0);
    });

    document.getElementById("smaller").onclick = () => window.api.lyrics.resizeBy(-120, -40);
    document.getElementById("larger").onclick = () => window.api.lyrics.resizeBy(120, 40);
    document.getElementById("reset").onclick = () => window.api.lyrics.resetSize();
    document.getElementById("close").onclick = () => window.api.lyrics.close();
    document.getElementById("pin").onclick = (e) => {
      pinned = !pinned;
      window.api.lyrics.setPinned(pinned);
      e.target.style.opacity = pinned ? 1 : 0.4;
    };
  </script>
</body>
</html>
