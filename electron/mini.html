<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #14171c; overflow: hidden; border-radius: 10px; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  #bar {
    height: 96px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    -webkit-app-region: drag;
  }
  #cover {
    width: 64px; height: 64px; border-radius: 10px; flex-shrink: 0;
    background: #1a1e25; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    color: #5c6470; font-size: 24px;
  }
  #cover-img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #cover-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #info { flex: 1; min-width: 0; }
  #title {
    font-size: 13.5px; font-weight: 600; color: #e4e7ec;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #artist {
    font-size: 11.5px; color: #8b93a1; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #prog { margin-top: 8px; height: 4px; border-radius: 2px; background: #232833; cursor: pointer; position: relative; -webkit-app-region: no-drag; }
  #fill { height: 100%; border-radius: 2px; background: #7c8cf8; width: 0%; }
  #ctrl { display: flex; align-items: center; gap: 10px; -webkit-app-region: no-drag; }
  button {
    background: none; border: none; color: #8b93a1; cursor: pointer;
    font-size: 15px; padding: 4px; line-height: 1; transition: color 0.15s;
  }
  button:hover { color: #fff; }
  #play {
    width: 34px; height: 34px; border-radius: 50%; background: #7c8cf8;
    color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  #play:hover { background: #9aa7ff; color: #fff; }
  #expand { font-size: 13px; }
  #expand:hover { color: #7c8cf8; }
</style>
</head>
<body>
  <div id="bar">
    <div id="cover">
      <img id="cover-img" alt="" />
      <span id="cover-ph">♪</span>
    </div>
    <div id="info">
      <div id="title">未在播放</div>
      <div id="artist">从曲库选择一首歌</div>
      <div id="prog"><div id="fill"></div></div>
    </div>
    <div id="ctrl">
      <button id="prev" title="上一首">⏮</button>
      <button id="play" title="播放/暂停">▶</button>
      <button id="next" title="下一首">⏭</button>
      <button id="expand" title="回到主窗口">⛶</button>
    </div>
  </div>
  <script>
    let port = null;
    let lastState = null;
    const $ = (id) => document.getElementById(id);
    const coverImg = $("cover-img"), coverPh = $("cover-ph"),
          title = $("title"), artist = $("artist"), fill = $("fill"), play = $("play");

    const renderCover = (track) => {
      if (!track?.coverId || !port) {
        coverImg.removeAttribute("src");
        coverImg.style.display = "none";
        coverPh.style.display = "flex";
        return;
      }
      coverImg.onload = () => {
        coverImg.style.display = "block";
        coverPh.style.display = "none";
      };
      coverImg.onerror = () => {
        coverImg.style.display = "none";
        coverPh.style.display = "flex";
      };
      coverImg.src = `http://127.0.0.1:${port}/cover?id=${encodeURIComponent(track.coverId)}`;
    };

    const renderState = (s) => {
      if (!s) return;
      lastState = s;
      const t = s.track;
      if (t) {
        title.textContent = t.title || "未知歌曲";
        artist.textContent = [t.artist, t.album].filter(Boolean).join(" · ") || "未知艺人";
      } else {
        title.textContent = "未在播放";
        artist.textContent = "从曲库选择一首歌";
      }
      renderCover(t);
      const pct = s.duration > 0 ? Math.min(100, (s.progress / s.duration) * 100) : 0;
      fill.style.width = pct.toFixed(1) + "%";
      play.textContent = s.playing ? "❚❚" : "▶";
    };

    window.api.server.port().then((p) => {
      port = p;
      renderState(lastState);
    });
    window.api.mini.onState(renderState);

    $("prev").onclick = () => window.api.mini.cmd({ type: "prev" });
    $("play").onclick = () => window.api.mini.cmd({ type: "playpause" });
    $("next").onclick = () => window.api.mini.cmd({ type: "next" });
    $("expand").onclick = () => window.api.mini.cmd({ type: "expand" });
    $("prog").onclick = (e) => {
      const r = $("prog").getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      window.api.mini.cmd({ type: "seekRatio", value: ratio });
    };
  </script>
</body>
</html>
